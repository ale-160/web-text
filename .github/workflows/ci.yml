name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: write

jobs:
  # ============================================================
  # 安全检查：防 Pages Functions 注入
  # 本项目是纯静态导出（output: export），不应包含 functions/ 目录。
  # 防止恶意 PR 通过 Pages Functions 窃取 Cloudflare Pages 预览部署的 secrets。
  # ============================================================
  security-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Detect Pages Functions directory
        run: |
          if find . -path ./node_modules -prune -o -name "functions" -type d -print | grep -q .; then
            echo "::error::检测到 /functions/ 目录，本项目是纯静态导出（output: export），不应包含 Pages Functions。请检查是否为恶意代码注入。"
            exit 1
          fi
          echo "security check passed"

  # ============================================================
  # 质量门禁：audit + lint + build
  # 部署由 Cloudflare Pages 的 GitHub 集成自动完成（PR 预览 / 主分支生产）
  # ============================================================
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Security audit
        # 已知问题：next 内置 postcss/sharp 传递依赖有 high 漏洞，上游未修复
        # （npm audit fix --force 会破坏性降级 next）。不阻塞 CI，结果在 PR 评论中展示。
        run: |
          set -o pipefail
          npm audit --omit=dev --audit-level=high 2>&1 | tee /tmp/audit.log || echo "audit_failed" >> /tmp/audit_status
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # ============================================================
  # PR 评论：CI 结果自动通知（仅 PR 触发）
  # ============================================================
  pr-comment:
    needs: [security-check, quality]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Find existing comment
        id: find-comment
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- ci-status-comment -->'

      - name: Post CI status
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          SEC_CHECK_RESULT: ${{ needs.security-check.result }}
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            <!-- ci-status-comment -->
            ## CI 状态

            | 检查项 | 结果 |
            | --- | --- |
            | 安全检查 | ${{ env.SEC_CHECK_RESULT }} |
            | 质量门禁 (lint/build) | ${{ env.QUALITY_RESULT }} |

            ${{ needs.quality.result == 'success' && '✅ 全部通过，可以合并' || '❌ 有检查未通过，请查看 Actions 日志' }}

            > ⚠️ `npm audit` 可能因 Next.js 内置 postcss/sharp 传递依赖的已知漏洞（上游未修复，`fix --force` 会破坏性降级）而失败，此步骤不阻塞 CI，请关注上游更新。
